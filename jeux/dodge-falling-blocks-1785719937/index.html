<!DOCTYPE html>
<html>
<head>
	<title>Dodge Falling Blocks</title>
	<style>
		canvas {
			border: 1px solid black;
			background-color: white;
		}
	</style>
</head>
<body>
	<canvas id="game" width="400" height="600"></canvas>
	<script>
		var canvas = document.getElementById('game');
		var ctx = canvas.getContext('2d');
		var state = 'MENU';
		var score = 0;
		var blocks = [];
		var playerX = canvas.width / 2;

		function draw() {
			ctx.clearRect(0, 0, canvas.width, canvas.height);
			if (state === 'PLAYING') {
				for (var i = 0; i < blocks.length; i++) {
					ctx.fillStyle = 'gray';
					ctx.fillRect(blocks[i].x, blocks[i].y, 50, 20);
					blocks[i].y += 2;
					if (blocks[i].y > canvas.height) {
						blocks.splice(i, 1);
					} else if (Math.abs(blocks[i].x - playerX) < 25) {
						state = 'GAME OVER';
					}
				}
				ctx.fillStyle = 'black';
				ctx.font = '30px Arial';
				ctx.textAlign = 'center';
				ctx.fillText(score.toString(), canvas.width / 2, 30);
			} else if (state === 'MENU') {
				ctx.fillStyle = 'black';
				ctx.font = '40px Arial';
				ctx.textAlign = 'center';
				ctx.fillText('Dodge Falling Blocks', canvas.width / 2, 100);
				ctx.fillStyle = 'gray';
				ctx.font = '20px Arial';
				ctx.textAlign = 'center';
				ctx.fillText('Click to play', canvas.width / 2, 200);
			} else if (state === 'GAME OVER') {
				ctx.fillStyle = 'black';
				ctx.font = '40px Arial';
				ctx.textAlign = 'center';
				ctx.fillText('Game Over! Score: ' + score.toString(), canvas.width / 2, 100);
				ctx.fillStyle = 'gray';
				ctx.font = '20px Arial';
				ctx.textAlign = 'center';
				ctx.fillText('Click to replay', canvas.width / 2, 200);
			}
		}

		function startGame() {
			state = 'PLAYING';
			score = 0;
			playerX = canvas.width / 2;
			blocks.length = 0;
			for (var i = 0; i < 5; i++) {
				blocks.push({ x: Math.random() * (canvas.width - 50), y: -20 });
			}
		}

		function update(event) {
			if (state === 'PLAYING') {
				playerX += event.clientX - (canvas.width / 2);
				if (playerX < 0 || playerX > canvas.width - 50) {
					playerX = Math.min(Math.max(playerX, 0), canvas.width - 50);
				}
			} else if (state === 'MENU') {
				state = 'PLAYING';
				startGame();
			} else if (state === 'GAME OVER') {
				state = 'MENU';
			}
			score++;
			draw();
			requestAnimationFrame(update);
		}

		canvas.addEventListener('click', update);
		update(null);
	</script>
</body>
</html>
