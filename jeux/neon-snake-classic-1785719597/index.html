<!DOCTYPE html>
<html>
<head>
	<title>Neon Snake Classic</title>
	<style>
		body {
			background-color: #000;
			font-family: Arial, sans-serif;
			margin: 0;
			padding: 0;
		}
		
		#game {
			position: relative;
			width: 400px;
			height: 400px;
			border: 2px solid #fff;
			border-radius: 10px;
			box-shadow: 0px 0px 20px rgba(0, 0, 0, 0.5);
		}
		
		.snake-part {
			position: absolute;
			top: 0;
			left: 0;
			width: 20px;
			height: 20px;
			background-color: #f00;
			border-radius: 10px;
			transform-origin: top left;
			transform: translate(0, 0);
		}
		
		.food {
			position: absolute;
			top: 0;
			left: 0;
			width: 20px;
			height: 20px;
			background-color: #0f0;
			border-radius: 10px;
			transform-origin: top left;
			transform: translate(0, 0);
		}
		
		.score {
			position: absolute;
			top: 5px;
			right: 5px;
			font-size: 24px;
			color: #fff;
		}
	</style>
</head>
<body>
	<div id="game"></div>
	<script>
		const canvas = document.getElementById('game');
		const ctx = canvas.getContext('2d');
		
		let snakeParts = [];
		let foodPos = { x: 100, y: 100 };
		let score = 0;
		let gameStarted = false;
		let gameOver = false;
		
		function init() {
			canvas.width = window.innerWidth;
			canvas.height = window.innerHeight;
			
			snakeParts.push({ x: 50, y: 50 });
			requestAnimationFrame(update);
		}
		
		function update() {
			if (gameOver) return;
			
			ctx.clearRect(0, 0, canvas.width, canvas.height);
			ctx.fillStyle = '#000';
			ctx.fillRect(0, 0, canvas.width, canvas.height);
			
			for (let i = snakeParts.length - 1; i > 0; i--) {
				snakeParts[i] = { x: snakeParts[i-1].x, y: snakeParts[i-1].y };
			}
			
			const headPos = snakeParts[0];
			const newHeadPos = { x: headPos.x + (Math.random() > 0.5 ? -10 : 10), y: headPos.y + (Math.random() > 0.5 ? -10 : 10) };
			snakeParts.unshift(newHeadPos);
			
			if (snakeParts[0].x < 0 || snakeParts[0].y < 0 || snakeParts[0].x >= canvas.width || snakeParts[0].y >= canvas.height) {
				gameOver = true;
			}
			
			for (let i = 1; i < snakeParts.length; i++) {
				if (snakeParts[i].x === snakeParts[0].x && snakeParts[i].y === snakeParts[0].y) {
					gameOver = true;
					break;
				}
			}
			
			ctx.fillStyle = '#f00';
			for (let i = 0; i < snakeParts.length; i++) {
				ctx.fillRect(snakeParts[i].x, snakeParts[i].y, 20, 20);
			}
			
			ctx.fillStyle = '#0f0';
			ctx.fillRect(foodPos.x, foodPos.y, 20, 20);
			
			score++;
			document.getElementById('score').innerHTML = `Score: ${score}`;
			
			if (checkCollision(snakeParts[0], foodPos)) {
				snakeParts.push({ x: foodPos.x, y: foodPos.y });
				foodPos = { x: Math.random() * canvas.width, y: Math.random() * canvas.height };
			}
			
			requestAnimationFrame(update);
		}
		
		function checkCollision(pos1, pos2) {
			return (Math.abs(pos1.x - pos2.x) < 20 && Math.abs(pos1.y - pos2.y) < 20);
		}
		
		init();
	</script>
	<div id="score" class="score"></div>
</body>
</html>
